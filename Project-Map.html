        :root {
            --primary-dark: #1B4D3E;   /* Tiefes Waldgrün */

        /* Header */
        header {
            background-color: var(--white);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .site-logo {
            height: 40px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: bold;
        }

        nav a:hover {
            color: var(--primary-dark);
        }
